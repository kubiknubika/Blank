name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    # Test the declared Node floor (22.13.0 — first release with unflagged
    # node:sqlite) AND the latest 22.x. A floating "22" alone would never
    # exercise the minimum our engines field promises.
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.13.0', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Gate on what actually ships in the Docker image. Dev-only
        # advisories are tracked by dependabot but must not block merges.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # Browser binaries live outside the npm registry, so they are
        # installed only here in CI — never as a postinstall hook.
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        # The Playwright webServer builds the app and boots the real
        # Express server (NODE_ENV=production) against a fresh seeded DB.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
