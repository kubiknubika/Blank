name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    # Test the declared Node floor (22.13.0 — first release with unflagged
    # node:sqlite) AND the latest 22.x. A floating "22" alone would never
    # exercise the minimum our engines field promises.
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.13.0', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
