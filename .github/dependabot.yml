# Dependency hygiene: weekly PRs, grouped so the inbox stays sane.
# Security updates arrive immediately regardless of the schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Base-image updates for the Dockerfile (node:22-alpine digests/CVEs).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
